[pytest]
# Configuración de las pruebas Playwright (pytest + pytest-playwright).
# Este archivo hace que tests/playwright sea la raíz de pytest, tanto si se
# ejecuta desde la raíz del proyecto (pytest tests/playwright) como desde aquí.

# "." -> para importar pw_pages ; "../.." -> raíz del proyecto (utils/test_data.py)
pythonpath = . ../..

testpaths = funcionales uat

# Captura de pantalla automática solo cuando una prueba falla.
addopts = -v --screenshot=only-on-failure --output=evidencias-playwright --strict-markers

markers =
    funcional: casos funcionales CP-01 a CP-31
    uat: casos de aceptación de usuario CP-32 a CP-41
    defecto: caso que falla a propósito por un defecto conocido de la app (DEF-01)
